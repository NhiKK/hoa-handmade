<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nụ Xinh – Hoa handmade</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- HEADER: logo & menu tự lấy từ trang quản trị -->
<header class="header">
  <a href="#top" class="logo"><span data-site="logoEmoji">🌸</span> <span data-site="shopName">Nụ Xinh</span></a>
  <button class="menu-btn" id="menuBtn" aria-label="Mở menu">☰</button>
  <nav id="nav" class="nav"></nav>
  <div class="actions">
    <a class="btn-zalo zalo-link" href="https://zalo.me/0900000000" target="_blank" rel="noopener">Chat Zalo</a>
    <span class="cart" aria-label="Số sản phẩm đã chọn">🛍 <span id="cartCount">0</span></span>
  </div>
</header>

<!-- CÁC KHỐI TRANG CHỦ: được dựng bằng JS theo thứ tự trong trang quản trị -->
<main id="top"><div id="blocks"></div></main>

<footer id="contact" class="footer">
  <div>
    <strong><span data-site="logoEmoji">🌸</span> <span data-site="shopName">Nụ Xinh</span></strong>
    <p data-site="address"></p>
    <p>Điện thoại: <a class="tel-link" href="tel:0900000000" data-site="phone">0900 000 000</a></p>
  </div>
  <div>
    <a class="facebook-link" href="https://facebook.com/" target="_blank" rel="noopener">Facebook</a>
    <a class="zalo-link" href="https://zalo.me/0900000000" target="_blank" rel="noopener">Zalo</a>
    <a class="instagram-link" href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
  </div>
  <small data-site="copyright"></small>
</footer>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="closeModal" aria-label="Đóng">✕</button>
    <div class="m-img" id="mImg"></div>
    <div class="m-info">
      <h3 id="mTitle"></h3>
      <p class="price" id="mPrice"></p>
      <dl>
        <dt>Chất liệu</dt><dd id="mMaterial"></dd>
        <dt>Kích thước</dt><dd id="mSize"></dd>
        <dt>Ý nghĩa</dt><dd id="mMeaning"></dd>
      </dl>
      <button class="btn" id="addCart">Đặt mua ngay</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
